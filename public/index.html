<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no" />
    <meta name="description" content="Catálogo digital de produtos Briland." />
    <meta name="theme-color" content="#021126" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        color-scheme: only light;
        background-color: #f4f6fa;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      if ("serviceWorker" in navigator && window.location.protocol === "https:") {
        var reloadingForServiceWorker = false;
        var updatePromptShown = false;
        function offerServiceWorkerUpdate(worker) {
          if (!worker || updatePromptShown) return;
          updatePromptShown = true;
          var accepted = window.confirm("Nova versão disponível\n\nHá uma melhoria do catálogo pronta para instalar. Deseja atualizar agora?");
          if (!accepted) return;
          window.dispatchEvent(new Event("briland-before-code-update"));
          worker.postMessage({ type: "SKIP_WAITING" });
        }
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (reloadingForServiceWorker) return;
          reloadingForServiceWorker = true;
          window.location.reload();
        });
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register("/sw.js?v=2026081301", { updateViaCache: "none" })
            .then(function (registration) {
              if (registration.waiting) offerServiceWorkerUpdate(registration.waiting);
              registration.addEventListener("updatefound", function () {
                var worker = registration.installing;
                if (!worker) return;
                worker.addEventListener("statechange", function () {
                  if (worker.state === "installed" && navigator.serviceWorker.controller) offerServiceWorkerUpdate(worker);
                });
              });
              return registration.update();
            })
            .catch(function () {});
        });
      }
    </script>
  </body>
</html>
